[project]
name = "rag-opm"
version = "0.1.0"
description = "Utility-Aware RAG Evaluator (Optimal Predictor Machine - OPM)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sameer", email = "sameermubeen4@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "groq>=0.9.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "pytest>=8.2.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
